<!DOCTYPE html>
<html>

<head>

<title>VOLTX PRO Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
}

.card{
background:#1e293b;
padding:20px;
margin:20px;
border-radius:12px;
}

.alert{
color:red;
font-size:24px;
font-weight:bold;
}

.ok{
color:lime;
font-size:24px;
}

input{
width:80%;
padding:10px;
}

button{
padding:10px 20px;
margin-top:10px;
}

</style>

</head>

<body>

<h1>⚡ VOLTX PRO</h1>

<div class="card">

<h2>Grid Status</h2>

<p>Voltage: <span id="voltage">--</span></p>

<p>Current: <span id="current">--</span></p>

<p id="alert"></p>

</div>

<div class="card">

<h2>Latest Transaction</h2>

<input id="tx" readonly>

<br>

<button onclick="copyTx()">Copy</button>

</div>

<div class="card">

<canvas id="chart"></canvas>

</div>

<script>

const ctx = document.getElementById("chart")

const chart = new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[
{
label:"Voltage",
data:[],
borderColor:"cyan"
},
{
label:"Current",
data:[],
borderColor:"yellow"
}
]
},
options:{
animation:false
}
})


async function updateStatus(){

const res = await fetch("http://127.0.0.1:8000/status")

const data = await res.json()

document.getElementById("voltage").innerText=data.voltage
document.getElementById("current").innerText=data.current

document.getElementById("tx").value=data.tx

if(data.theft){
document.getElementById("alert").innerHTML="🚨 POWER THEFT DETECTED"
document.getElementById("alert").className="alert"
}else{
document.getElementById("alert").innerHTML="✅ GRID NORMAL"
document.getElementById("alert").className="ok"
}

}


async function updateGraph(){

const res = await fetch("http://127.0.0.1:8000/history")

const data = await res.json()

chart.data.labels=data.map((_,i)=>i)

chart.data.datasets[0].data=data.map(x=>x.voltage)

chart.data.datasets[1].data=data.map(x=>x.current)

chart.update()

}


function copyTx(){

const tx=document.getElementById("tx")

tx.select()

document.execCommand("copy")

alert("TX copied")

}


setInterval(updateStatus,2000)

setInterval(updateGraph,2000)

</script>

</body>

</html>
